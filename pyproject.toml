[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-sift"
version = "0.1.0"
description = "CLI-приложение для расшифровки интервью через Whisper и извлечения вопросов интервьюеров."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper",
    "imageio-ffmpeg",
]

[project.scripts]
whisper-sift = "whisper_sift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
